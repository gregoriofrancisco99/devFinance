<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />

  <title>dev.finance$ — Register</title>
</head>

<body>
  <header>
    <img src="./assets/logo.svg" alt="logo dev.finace$" />
  </header>

  <section id="register-page" class="auth-page">
    <div class="auth-card">
      <h2>Crie sua conta</h2>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required />
        <input type="password" id="auth-password" placeholder="Senha" required />
        <input type="password" id="auth-password-confirm" placeholder="Confirme a senha" required />
        <button type="button" id="register-button" class="button">Cadastrar</button>
        <p class="auth-secondary">Já tem conta? <a href="./login.html">Entrar</a></p>
        <p id="auth-message" class="auth-message"></p>
      </form>
    </div>
  </section>

  <footer>
    <p>dev.finace$ <br />design by RocketSeat, <br />code by: Gregório Francisco</p>
  </footer>

  <script src="bundle.js"></script>
</body>

</html>
